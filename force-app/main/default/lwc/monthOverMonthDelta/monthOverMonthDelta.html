<template>
  <div class="slds-box slds-box_x-small month-over-month-delta">
    <h3 class="slds-text-heading_small slds-m-bottom_small">
      vs. Previous Month
    </h3>
    <template if:true={errorMessage}>
      <p class="slds-text-color_error slds-text-body_small">{errorMessage}</p>
    </template>
    <template if:false={hasPrevious}>
      <p class="slds-text-color_weak slds-text-body_small">
        No prior month to compare.
      </p>
    </template>
    <template if:true={hasPrevious}>
      <p class={deltaClass}>{arrow} {displayDelta}</p>
      <p class="delta-caption">volume change</p>
    </template>
  </div>
</template>

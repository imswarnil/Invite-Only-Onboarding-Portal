<template>
  <div class="invite-homepage">
    <section class="homepage-section homepage-header-section">
      <c-home-header
        title="Invite Only Onboarding"
        subtitle="Reviewer workspace"
      ></c-home-header>
    </section>

    <section class="homepage-section homepage-stats-section">
      <c-stat-tile
        label="Total Invite Requests"
        value={totalRequests}
        accent="purple"
      ></c-stat-tile>
      <c-stat-tile
        label="Avg Fit Score"
        value={averageFitScore}
        accent="navy"
      ></c-stat-tile>
      <c-stat-tile
        label="Provisioned Accounts"
        value={provisionedTotal}
        accent="green"
      ></c-stat-tile>
      <c-stat-tile
        label="Needs Attention"
        value={needsAttentionCount}
        sublabel="Action Needed + Waitlisted"
        accent="orange"
      ></c-stat-tile>
    </section>

    <section class="homepage-section homepage-main-section">
      <div class="homepage-col homepage-col-primary">
        <c-stage-funnel></c-stage-funnel>
      </div>
      <div class="homepage-col homepage-col-secondary">
        <c-applicant-type-split></c-applicant-type-split>
      </div>
      <div class="homepage-col homepage-col-secondary">
        <c-provisioned-accounts-summary></c-provisioned-accounts-summary>
      </div>
    </section>

    <section class="homepage-section homepage-list-section">
      <c-recent-invites-list></c-recent-invites-list>
    </section>
  </div>
</template>

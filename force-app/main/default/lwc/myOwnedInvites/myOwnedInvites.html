<template>
  <div class="slds-box slds-box_x-small my-owned-invites">
    <h3 class="slds-text-heading_small slds-m-bottom_small">
      My Invite Requests
    </h3>
    <template if:true={errorMessage}>
      <p class="slds-text-color_error slds-text-body_small">{errorMessage}</p>
    </template>
    <template if:false={hasInvites}>
      <p class="slds-text-color_weak slds-text-body_small">
        Nothing owned by you right now -- most submissions come in owned by
        the Guest User until reassigned.
      </p>
    </template>
    <template for:each={invites} for:item="inv">
      <div
        key={inv.recordId}
        class="owned-row"
        data-id={inv.recordId}
        onclick={handleRowClick}
      >
        <span class="owned-name">{inv.name}</span>
        <span class="owned-stage">{inv.stage}</span>
      </div>
    </template>
  </div>
</template>

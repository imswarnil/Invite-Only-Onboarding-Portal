<template>
  <div class="slds-box slds-box_x-small recent-invites">
    <h3 class="slds-text-heading_small slds-m-bottom_small">
      Recent Invite Requests
    </h3>
    <template if:true={errorMessage}>
      <p class="slds-text-color_error slds-text-body_small">{errorMessage}</p>
    </template>
    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
      <thead>
        <tr class="slds-line-height_reset">
          <th scope="col"><div class="slds-truncate">Name</div></th>
          <th scope="col"><div class="slds-truncate">Applicant</div></th>
          <th scope="col"><div class="slds-truncate">Type</div></th>
          <th scope="col"><div class="slds-truncate">Stage</div></th>
          <th scope="col"><div class="slds-truncate">Score</div></th>
        </tr>
      </thead>
      <tbody>
        <template for:each={rows} for:item="row">
          <tr
            key={row.id}
            class="invite-row"
            data-id={row.id}
            onclick={handleRowClick}
          >
            <td><div class="slds-truncate row-link">{row.name}</div></td>
            <td><div class="slds-truncate">{row.applicant}</div></td>
            <td><div class="slds-truncate">{row.type}</div></td>
            <td><span class={row.stageClass}>{row.stage}</span></td>
            <td><div class="slds-truncate">{row.score}</div></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</template>

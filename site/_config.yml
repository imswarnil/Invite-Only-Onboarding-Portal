title: Invite Only Portal
description: >-
  A hands-on learning project: an invite-only onboarding back office modeled on Stripe India's
  real application flow, built to learn Salesforce's AI stack (Prompt Builder, Flow, Agentforce,
  Data Cloud) end to end.
url: "https://stripe.imswarnil.com"
lang: en
github_repo: "imswarnil/Invite-Only-Onboarding-Portal"
author: "Swarnil Singhai"
twitter_card: summary_large_image
hire_me_url: "https://imswarnil.com/about"
disclaimer: >-
  Independent educational project built by one person to learn the Salesforce AI stack. It is not
  affiliated with, endorsed by, or connected to Stripe, Salesforce, Agentforce, n8n, or any other
  company named on this site. Product names are used only to describe what was studied and
  rebuilt for practice — nothing here is production software or an official integration.

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

collections:
  learning:
    output: true
    permalink: /learn/:name/

defaults:
  - scope:
      path: ""
      type: learning
    values:
      layout: doc

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md

sass:
  style: compressed

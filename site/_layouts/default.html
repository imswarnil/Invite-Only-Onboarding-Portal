<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}
    </title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}"
    />
    <meta name="author" content="{{ site.author }}" />
    <meta name="theme-color" content="#635bff" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {
          /* localStorage unavailable (private mode, etc.) — fall back to prefers-color-scheme */
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta
      property="og:title"
      content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}"
    />
    <meta
      property="og:description"
      content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}"
    />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta
      name="twitter:card"
      content="{{ site.twitter_card | default: 'summary' }}"
    />
    <meta
      name="twitter:title"
      content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}"
    />
    <meta
      name="twitter:description"
      content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}"
    />

    <link
      rel="icon"
      href="{{ '/assets/images/favicon.svg' | relative_url }}"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": {{ site.title | jsonify }},
        "url": {{ site.url | jsonify }},
        "description": {{ site.description | strip_html | strip_newlines | jsonify }},
        "author": {
          "@type": "Person",
          "name": {{ site.author | jsonify }},
          "url": {{ site.hire_me_url | jsonify }}
        }
      }
    </script>
    {% if page.collection == "learning" %}
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Article", "LearningResource"],
        "headline": {{ page.title | jsonify }},
        "description": {{ page.summary | default: site.description | strip_html | strip_newlines | truncate: 160 | jsonify }},
        "url": {{ page.url | absolute_url | jsonify }},
        "isPartOf": {
          "@type": "CreativeWorkSeries",
          "name": "Learn in Public",
          "url": {{ '/' | absolute_url | jsonify }}
        },
        "author": {
          "@type": "Person",
          "name": {{ site.author | jsonify }}
        },
        "educationalLevel": "Beginner",
        "learningResourceType": "Lesson"
      }
    </script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content">{{ content }}</main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>

<a
  class="gh-star-button"
  href="https://github.com/{{ site.github_repo }}"
  target="_blank"
  rel="noopener"
  id="gh-star-link"
>
  <svg viewBox="0 0 16 16" aria-hidden="true">
    <path
      d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"
    ></path>
  </svg>
  Star
  <span class="gh-star-count" id="gh-star-count">on GitHub</span>
</a>
<script>
  (function () {
    var el = document.getElementById("gh-star-count");
    if (!el) return;
    fetch("https://api.github.com/repos/{{ site.github_repo }}")
      .then(function (res) {
        return res.ok ? res.json() : null;
      })
      .then(function (data) {
        if (data && typeof data.stargazers_count === "number") {
          el.textContent = data.stargazers_count;
        }
      })
      .catch(function () {
        /* leave the "on GitHub" fallback text as-is */
      });
  })();
</script>

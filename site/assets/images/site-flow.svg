<svg viewBox="0 0 1080 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sf-title sf-desc">
  <title id="sf-title">Full site flow</title>
  <desc id="sf-desc">Sign up and stand up the org, model the data, secure it with permissions, crawl with n8n, reason with Prompt Builder and Agentforce, ground with Data Cloud, then provision the account.</desc>

  <style>
    .sf-line { stroke: #635BFF; stroke-width: 2.5; stroke-dasharray: 7 7; animation: sf-flow 1.1s linear infinite; }
    .sf-node-2 { animation-delay: .16s; } .sf-node-3 { animation-delay: .32s; }
    .sf-node-4 { animation-delay: .48s; } .sf-node-5 { animation-delay: .64s; }
    .sf-node-6 { animation-delay: .8s; }
    .sf-pulse { animation: sf-pulse 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes sf-flow { to { stroke-dashoffset: -28; } }
    @keyframes sf-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .sf-line, .sf-pulse { animation: none; } }
  </style>

  <!-- connectors -->
  <line class="sf-line" x1="140" y1="130" x2="200" y2="130"/>
  <line class="sf-line sf-node-2" x1="290" y1="130" x2="350" y2="130"/>
  <line class="sf-line sf-node-3" x1="440" y1="130" x2="500" y2="130"/>
  <line class="sf-line sf-node-4" x1="590" y1="130" x2="650" y2="130"/>
  <line class="sf-line sf-node-5" x1="740" y1="130" x2="800" y2="130"/>
  <line class="sf-line sf-node-6" x1="890" y1="130" x2="950" y2="130"/>
  <polygon points="200,124 212,130 200,136" fill="#635BFF"/>
  <polygon points="350,124 362,130 350,136" fill="#635BFF"/>
  <polygon points="500,124 512,130 500,136" fill="#635BFF"/>
  <polygon points="650,124 662,130 650,136" fill="#635BFF"/>
  <polygon points="800,124 812,130 800,136" fill="#635BFF"/>
  <polygon points="950,124 962,130 950,136" fill="#635BFF"/>

  <!-- 1: Sign up / org -->
  <g transform="translate(20,80)">
    <rect width="120" height="100" rx="14" fill="#F6F9FC" stroke="#E3E8EE" stroke-width="1.5"/>
    <circle class="sf-pulse" cx="60" cy="34" r="16" fill="#0A2540"/>
    <path d="M52,34 h16 M60,26 v16" stroke="#F6F9FC" stroke-width="2.5" stroke-linecap="round"/>
    <text x="60" y="66" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#0A2540">Sign up</text>
    <text x="60" y="82" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#425466">&amp; org setup</text>
  </g>

  <!-- 2: Data model -->
  <g transform="translate(212,80)">
    <rect width="120" height="100" rx="14" fill="#F6F9FC" stroke="#E3E8EE" stroke-width="1.5"/>
    <g class="sf-pulse" transform="translate(60,34)">
      <rect x="-16" y="-8" width="32" height="7" rx="3.5" fill="#0A2540"/>
      <rect x="-16" y="2" width="32" height="7" rx="3.5" fill="#635BFF"/>
      <rect x="-16" y="12" width="20" height="7" rx="3.5" fill="#E3E8EE"/>
    </g>
    <text x="60" y="66" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#0A2540">Data model</text>
    <text x="60" y="82" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#425466">4 objects</text>
  </g>

  <!-- 3: Permissions -->
  <g transform="translate(362,80)">
    <rect width="120" height="100" rx="14" fill="#F6F9FC" stroke="#E3E8EE" stroke-width="1.5"/>
    <path class="sf-pulse" d="M60,20 l16,6 v14 c0,12 -7,20 -16,24 c-9,-4 -16,-12 -16,-24 v-14 z" fill="#0A2540"/>
    <path d="M53,38 l5,5 l10,-11" stroke="#F6F9FC" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="66" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#0A2540">Permissions</text>
    <text x="60" y="82" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#425466">FLS &amp; Guest User</text>
  </g>

  <!-- 4: n8n crawl -->
  <g transform="translate(512,80)">
    <rect width="120" height="100" rx="14" fill="#F6F9FC" stroke="#E3E8EE" stroke-width="1.5"/>
    <g class="sf-pulse" transform="translate(60,34)">
      <circle cx="-14" cy="0" r="6" fill="#EA4B71"/>
      <circle cx="14" cy="-8" r="6" fill="#EA4B71"/>
      <circle cx="14" cy="8" r="6" fill="#EA4B71"/>
      <path d="M-9,0 h10 M4,-8 l0,0 M-4,3 l8,-8 M-4,-3 l8,8" stroke="#EA4B71" stroke-width="2"/>
    </g>
    <text x="60" y="66" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#0A2540">n8n crawl</text>
    <text x="60" y="82" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#425466">the "hands"</text>
  </g>

  <!-- 5: AI layer -->
  <g transform="translate(662,80)">
    <rect width="120" height="100" rx="14" fill="#FFFFFF" stroke="#635BFF" stroke-width="2"/>
    <circle class="sf-pulse" cx="60" cy="34" r="16" fill="#635BFF"/>
    <path d="M52,31 a8 8 0 0 1 16 0 a8 6 0 0 1 -3 10 h-10 a8 6 0 0 1 -3 -10 z" fill="#FFFFFF"/>
    <text x="60" y="66" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#0A2540">AI layer</text>
    <text x="60" y="82" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#425466">Prompt + Agentforce</text>
  </g>

  <!-- 6: Data Cloud -->
  <g transform="translate(812,80)">
    <rect width="120" height="100" rx="14" fill="#F6F9FC" stroke="#E3E8EE" stroke-width="1.5"/>
    <g class="sf-pulse" transform="translate(60,34)">
      <path d="M-16,4 a8 8 0 0 1 8,-8 a10 10 0 0 1 19,-2 a7 7 0 0 1 -1,14 h-24 a6 6 0 0 1 -2,-4 z" fill="#00A1E0"/>
    </g>
    <text x="60" y="66" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#0A2540">Data Cloud</text>
    <text x="60" y="82" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#425466">unify (planned)</text>
  </g>

  <!-- 7: Provisioned -->
  <g transform="translate(962,80)">
    <rect width="98" height="100" rx="14" fill="#F6F9FC" stroke="#E3E8EE" stroke-width="1.5"/>
    <circle class="sf-pulse" cx="49" cy="34" r="16" fill="#0A2540"/>
    <path d="M41,34 l6,6 l11,-13" stroke="#F6F9FC" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="49" y="66" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#0A2540">Provisioned</text>
    <text x="49" y="82" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="9" fill="#425466">account</text>
  </g>
</svg>

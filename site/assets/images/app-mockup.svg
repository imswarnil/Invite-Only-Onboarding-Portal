<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="am-title am-desc">
  <title id="am-title">The reviewer dashboard</title>
  <desc id="am-desc">A bento-grid dashboard: stat tiles for the pipeline, a stage funnel bar chart, an applicant-type doughnut, and a list of requests ready to provision.</desc>

  <style>
    .am-bar { animation: am-grow 3s ease-in-out infinite; transform-origin: bottom; transform-box: fill-box; }
    .am-bar-2 { animation-delay: .2s; } .am-bar-3 { animation-delay: .4s; }
    .am-bar-4 { animation-delay: .6s; } .am-bar-5 { animation-delay: .8s; }
    .am-ring { animation: am-spin 9s linear infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes am-grow { 0%, 100% { transform: scaleY(.82); } 50% { transform: scaleY(1); } }
    @keyframes am-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .am-bar, .am-ring { animation: none; } }
  </style>

  <rect width="1000" height="600" fill="#FFFFFF"/>

  <!-- top app bar -->
  <rect x="0" y="0" width="1000" height="52" fill="#0A2540"/>
  <rect x="24" y="20" width="12" height="12" rx="3" fill="#635BFF"/>
  <rect x="46" y="22" width="120" height="9" rx="4.5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="220" y="22" width="58" height="9" rx="4.5" fill="#FFFFFF" opacity="0.4"/>
  <rect x="294" y="22" width="58" height="9" rx="4.5" fill="#FFFFFF" opacity="0.4"/>
  <rect x="368" y="22" width="58" height="9" rx="4.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="960" cy="26" r="13" fill="#635BFF"/>

  <!-- stat tiles -->
  <g>
    <rect x="24" y="76" width="226" height="96" rx="12" fill="#F6F9FC" stroke="#E3E8EE"/>
    <rect x="44" y="96" width="72" height="8" rx="4" fill="#425466" opacity="0.6"/>
    <text x="44" y="146" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="700" fill="#0A2540">128</text>
    <rect x="188" y="132" width="42" height="18" rx="9" fill="#ECFDF3"/>
    <text x="196" y="145" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#027A48">+12%</text>
  </g>
  <g>
    <rect x="266" y="76" width="226" height="96" rx="12" fill="#F6F9FC" stroke="#E3E8EE"/>
    <rect x="286" y="96" width="88" height="8" rx="4" fill="#425466" opacity="0.6"/>
    <text x="286" y="146" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="700" fill="#0A2540">34</text>
    <rect x="430" y="132" width="42" height="18" rx="9" fill="#ECFDF3"/>
    <text x="438" y="145" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#027A48">+8%</text>
  </g>
  <g>
    <rect x="508" y="76" width="226" height="96" rx="12" fill="#F6F9FC" stroke="#E3E8EE"/>
    <rect x="528" y="96" width="64" height="8" rx="4" fill="#425466" opacity="0.6"/>
    <text x="528" y="146" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="700" fill="#0A2540">92</text>
  </g>
  <g>
    <rect x="750" y="76" width="226" height="96" rx="12" fill="#635BFF"/>
    <rect x="770" y="96" width="80" height="8" rx="4" fill="#FFFFFF" opacity="0.7"/>
    <text x="770" y="146" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">18</text>
  </g>

  <!-- stage funnel bar chart -->
  <rect x="24" y="192" width="468" height="248" rx="12" fill="#FFFFFF" stroke="#E3E8EE"/>
  <rect x="48" y="216" width="132" height="10" rx="5" fill="#0A2540"/>
  <rect x="48" y="404" width="396" height="1" fill="#E3E8EE"/>
  <rect class="am-bar" x="66" y="264" width="52" height="140" rx="6" fill="#635BFF"/>
  <rect class="am-bar am-bar-2" x="140" y="290" width="52" height="114" rx="6" fill="#635BFF" opacity="0.82"/>
  <rect class="am-bar am-bar-3" x="214" y="312" width="52" height="92" rx="6" fill="#635BFF" opacity="0.64"/>
  <rect class="am-bar am-bar-4" x="288" y="336" width="52" height="68" rx="6" fill="#635BFF" opacity="0.46"/>
  <rect class="am-bar am-bar-5" x="362" y="358" width="52" height="46" rx="6" fill="#635BFF" opacity="0.3"/>

  <!-- applicant type doughnut -->
  <rect x="508" y="192" width="226" height="248" rx="12" fill="#FFFFFF" stroke="#E3E8EE"/>
  <rect x="532" y="216" width="110" height="10" rx="5" fill="#0A2540"/>
  <g class="am-ring">
    <circle cx="621" cy="330" r="62" fill="none" stroke="#E3E8EE" stroke-width="26"/>
    <circle cx="621" cy="330" r="62" fill="none" stroke="#635BFF" stroke-width="26"
            stroke-dasharray="243 146" stroke-linecap="round" transform="rotate(-90 621 330)"/>
  </g>
  <text x="621" y="338" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700" fill="#0A2540">62%</text>

  <!-- ready-to-provision list -->
  <rect x="750" y="192" width="226" height="248" rx="12" fill="#FFFFFF" stroke="#E3E8EE"/>
  <rect x="774" y="216" width="120" height="10" rx="5" fill="#0A2540"/>
  <g>
    <rect x="774" y="246" width="178" height="42" rx="8" fill="#F6F9FC"/>
    <circle cx="796" cy="267" r="10" fill="#635BFF" opacity="0.25"/>
    <rect x="814" y="258" width="86" height="7" rx="3.5" fill="#0A2540"/>
    <rect x="814" y="271" width="54" height="6" rx="3" fill="#425466" opacity="0.6"/>
    <rect x="916" y="261" width="26" height="14" rx="7" fill="#ECFDF3"/>
  </g>
  <g>
    <rect x="774" y="296" width="178" height="42" rx="8" fill="#F6F9FC"/>
    <circle cx="796" cy="317" r="10" fill="#635BFF" opacity="0.25"/>
    <rect x="814" y="308" width="86" height="7" rx="3.5" fill="#0A2540"/>
    <rect x="814" y="321" width="54" height="6" rx="3" fill="#425466" opacity="0.6"/>
    <rect x="916" y="311" width="26" height="14" rx="7" fill="#ECFDF3"/>
  </g>
  <g>
    <rect x="774" y="346" width="178" height="42" rx="8" fill="#F6F9FC"/>
    <circle cx="796" cy="367" r="10" fill="#635BFF" opacity="0.25"/>
    <rect x="814" y="358" width="86" height="7" rx="3.5" fill="#0A2540"/>
    <rect x="814" y="371" width="54" height="6" rx="3" fill="#425466" opacity="0.6"/>
    <rect x="916" y="361" width="26" height="14" rx="7" fill="#FEF3F2"/>
  </g>

  <!-- bottom row: pipeline aging -->
  <rect x="24" y="460" width="952" height="116" rx="12" fill="#FFFFFF" stroke="#E3E8EE"/>
  <rect x="48" y="484" width="140" height="10" rx="5" fill="#0A2540"/>
  <rect x="48" y="514" width="904" height="1" fill="#E3E8EE"/>
  <rect x="48" y="530" width="180" height="8" rx="4" fill="#425466" opacity="0.5"/>
  <rect x="268" y="530" width="140" height="8" rx="4" fill="#425466" opacity="0.5"/>
  <rect x="448" y="530" width="200" height="8" rx="4" fill="#425466" opacity="0.5"/>
  <rect x="688" y="530" width="110" height="8" rx="4" fill="#425466" opacity="0.5"/>
  <rect x="880" y="524" width="72" height="20" rx="10" fill="#635BFF" opacity="0.12"/>
</svg>

<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bh-title bh-desc">
  <title id="bh-title">Brain vs hands mental model</title>
  <desc id="bh-desc">n8n fetches the web and hands clean text to Salesforce, which reasons and writes results back.</desc>

  <!-- n8n / hands box -->
  <rect x="20" y="60" width="200" height="100" rx="14" fill="#F6F9FC" stroke="#E3E8EE" stroke-width="1.5"/>
  <circle cx="60" cy="95" r="14" fill="#0A2540"/>
  <path d="M53 95 q7 10 14 0" stroke="#F6F9FC" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="86" y="100" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="700" fill="#0A2540">n8n</text>
  <text x="44" y="128" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#425466">the hands</text>
  <text x="44" y="148" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#425466">fetches the web</text>

  <!-- arrow 1 -->
  <line x1="220" y1="110" x2="290" y2="110" stroke="#635BFF" stroke-width="2.5"/>
  <polygon points="290,103 302,110 290,117" fill="#635BFF"/>
  <text x="228" y="95" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#635BFF">clean text</text>

  <!-- Salesforce / brain box -->
  <rect x="310" y="40" width="220" height="140" rx="14" fill="#FFFFFF" stroke="#635BFF" stroke-width="2"/>
  <circle cx="355" cy="85" r="16" fill="#635BFF"/>
  <path d="M347 82 a8 8 0 0 1 16 0 a8 6 0 0 1 -3 10 h-10 a8 6 0 0 1 -3 -10 z" fill="#FFFFFF"/>
  <text x="382" y="90" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="700" fill="#0A2540">Salesforce AI</text>
  <text x="334" y="118" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#425466">the brain</text>
  <text x="334" y="140" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#425466">Prompt Builder</text>
  <text x="334" y="158" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#425466">Agentforce &#183; Data Cloud</text>

  <!-- arrow back -->
  <line x1="530" y1="150" x2="610" y2="150" stroke="#0A2540" stroke-width="2.5"/>
  <polygon points="610,143 622,150 610,157" fill="#0A2540"/>
  <text x="536" y="175" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#0A2540">writes results back</text>

  <!-- Record box -->
  <rect x="620" y="105" width="80" height="90" rx="10" fill="#F6F9FC" stroke="#E3E8EE" stroke-width="1.5"/>
  <rect x="636" y="122" width="48" height="6" rx="3" fill="#0A2540"/>
  <rect x="636" y="136" width="48" height="6" rx="3" fill="#635BFF"/>
  <rect x="636" y="150" width="30" height="6" rx="3" fill="#E3E8EE"/>
  <text x="636" y="182" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" fill="#425466">record</text>
</svg>

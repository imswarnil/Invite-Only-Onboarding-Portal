<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hs-title hs-desc">
  <title id="hs-title">The Invite Only Portal pipeline</title>
  <desc id="hs-desc">An applicant applies, n8n and Salesforce AI research and score them, a reviewer decides, and an approved applicant becomes a provisioned account.</desc>

  <style>
    .hs-line { stroke: #635BFF; stroke-width: 2.5; stroke-dasharray: 7 7; animation: hs-flow 1.1s linear infinite; }
    .hs-line-2 { animation-delay: .28s; }
    .hs-line-3 { animation-delay: .56s; }
    .hs-pulse { animation: hs-pulse 2.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .hs-pulse-2 { animation-delay: .5s; }
    .hs-pulse-3 { animation-delay: 1s; }
    .hs-pulse-4 { animation-delay: 1.5s; }
    @keyframes hs-flow { to { stroke-dashoffset: -28; } }
    @keyframes hs-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) {
      .hs-line, .hs-pulse { animation: none; }
    }
  </style>

  <!-- connectors -->
  <line class="hs-line" x1="150" y1="110" x2="230" y2="110"/>
  <line class="hs-line hs-line-2" x1="360" y1="110" x2="440" y2="110"/>
  <line class="hs-line hs-line-3" x1="570" y1="110" x2="650" y2="110"/>
  <polygon points="230,103 242,110 230,117" fill="#635BFF"/>
  <polygon points="440,103 452,110 440,117" fill="#635BFF"/>
  <polygon points="650,103 662,110 650,117" fill="#635BFF"/>

  <!-- 1: Applicant -->
  <g transform="translate(20,55)">
    <rect width="130" height="110" rx="16" fill="#F6F9FC" stroke="#E3E8EE" stroke-width="1.5"/>
    <circle class="hs-pulse" cx="65" cy="42" r="17" fill="#0A2540"/>
    <circle cx="65" cy="36" r="6" fill="#F6F9FC"/>
    <path d="M53,58 q12,-14 24,0" stroke="#F6F9FC" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="65" y="82" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#0A2540">Applicant</text>
    <text x="65" y="98" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#425466">applies, no login</text>
  </g>

  <!-- 2: AI + n8n -->
  <g transform="translate(230,45)">
    <rect width="130" height="130" rx="16" fill="#FFFFFF" stroke="#635BFF" stroke-width="2"/>
    <circle class="hs-pulse hs-pulse-2" cx="65" cy="46" r="18" fill="#635BFF"/>
    <path d="M56,43 a9,9 0 0 1 18,0 a9,7 0 0 1 -3,11 h-12 a9,7 0 0 1 -3,-11 z" fill="#FFFFFF"/>
    <text x="65" y="88" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#0A2540">AI + n8n</text>
    <text x="65" y="104" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#425466">researches &amp; scores</text>
    <text x="65" y="118" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#425466">brain + hands</text>
  </g>

  <!-- 3: Reviewer -->
  <g transform="translate(440,55)">
    <rect width="130" height="110" rx="16" fill="#F6F9FC" stroke="#E3E8EE" stroke-width="1.5"/>
    <circle class="hs-pulse hs-pulse-3" cx="65" cy="42" r="17" fill="#0A2540"/>
    <path d="M56,42 l7,7 l13,-15" stroke="#F6F9FC" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="82" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#0A2540">Reviewer</text>
    <text x="65" y="98" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#425466">decides, one click</text>
  </g>

  <!-- 4: Provisioned -->
  <g transform="translate(650,45)">
    <rect width="130" height="130" rx="16" fill="#FFFFFF" stroke="#635BFF" stroke-width="2"/>
    <circle class="hs-pulse hs-pulse-4" cx="65" cy="46" r="18" fill="#635BFF"/>
    <path d="M52,45 l8,8 l16,-18" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="88" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#0A2540">Provisioned</text>
    <text x="65" y="104" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#425466">account + usage</text>
    <text x="65" y="118" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="10" fill="#425466">tracked monthly</text>
  </g>
</svg>
